# Repo-level ruff config. The python software packages live under software/<pkg>/,
# and only sample-clonotypes carries a pyproject.toml, so the config sits at the
# root where ruff finds it for every package.
exclude = [
    ".venv",
    "dist",
    "node_modules",
    "build",
]
line-length = 120
indent-width = 4
target-version = "py312"

[lint]
select = ["E4", "E7", "E9", "E501", "F", "I"]

[format]
quote-style = "double"
indent-style = "space"
