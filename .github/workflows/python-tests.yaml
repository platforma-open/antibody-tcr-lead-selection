name: Python Tests

# Only the python packages under software/ are linted and tested here, so the
# pull_request and push triggers are scoped to that tree. merge_group does not
# support a path filter, so the jobs always run in the merge queue.
#
# Keep this workflow OUT of the "Main Branch" ruleset's required status checks:
# a required check that a path filter skips never reports, and the PR blocks.
on:
  merge_group:
  pull_request:
    types: [opened, reopened, synchronize]
    branches:
      - 'main'
    paths:
      - 'software/**'
      - 'ruff.toml'
      - '.github/workflows/python-tests.yaml'
  push:
    branches:
      - 'main'
    paths:
      - 'software/**'
      - 'ruff.toml'
      - '.github/workflows/python-tests.yaml'
  workflow_dispatch: {}

env:
  UV_VERSION: "0.12.15"

jobs:
  ruff:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: software
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          version: "${{ env.UV_VERSION }}"
          enable-cache: true
          cache-dependency-glob: software/uv.lock

      - name: Install dependencies
        run: uv sync --all-groups --locked

      # Targets software/ as a whole, so every package under it is covered.
      # ruff.toml sits at the repo root, which ruff finds by walking up.
      - name: Ruff check
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

  pytest:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: software
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          version: "${{ env.UV_VERSION }}"
          enable-cache: true
          cache-dependency-glob: software/uv.lock

      - name: Install dependencies
        run: uv sync --all-groups --locked

      # --all-groups installs every package's runtime pins alongside the dev
      # tooling, so the suite runs the versions the block ships. It collects
      # every <package>/tests/.
      - name: Run pytest
        run: uv run pytest

  requirements-sync:
    # Each <package>/src/requirements.txt is generated from its dependency group
    # in pyproject.toml, and pl-pkg builds the shipped environment from it. This
    # job fails when the committed file has drifted — someone changed a pin but
    # did not regenerate.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: software
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          version: "${{ env.UV_VERSION }}"
          enable-cache: true
          cache-dependency-glob: software/uv.lock

      - name: Regenerate requirements.txt from pyproject.toml
        run: ./scripts/deps-export.sh

      - name: Verify the committed files are in sync
        run: |
          if ! git diff --exit-code -- '*/src/requirements.txt'; then
            echo "::error::software/*/src/requirements.txt is out of sync with pyproject.toml"
            echo "Dependencies are defined in software/pyproject.toml, one group per package."
            echo "Resolve locally with:"
            echo "    cd software && ./scripts/deps-export.sh"
            echo "then commit the updated requirements.txt files."
            exit 1
          fi
