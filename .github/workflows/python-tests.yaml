name: Python Tests

# Only the python packages under software/ are linted and tested here, so the
# pull_request and push triggers are scoped to that tree. merge_group does not
# support a path filter, so the jobs always run in the merge queue.
#
# Keep this workflow OUT of the "Main Branch" ruleset's required status checks:
# a required check that a path filter skips never reports, and the PR blocks.
on:
  merge_group:
  pull_request:
    types: [opened, reopened, synchronize]
    branches:
      - 'main'
    paths:
      - 'software/**'
      - 'ruff.toml'
      - '.github/workflows/python-tests.yaml'
  push:
    branches:
      - 'main'
    paths:
      - 'software/**'
      - 'ruff.toml'
      - '.github/workflows/python-tests.yaml'
  workflow_dispatch: {}

env:
  UV_VERSION: "0.12.15"

jobs:
  ruff:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: software
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          version: "${{ env.UV_VERSION }}"
          enable-cache: true
          cache-dependency-glob: software/uv.lock

      - name: Install dependencies
        run: uv sync --all-groups --locked

      # Targets software/ as a whole, so every package under it is covered.
      # ruff.toml sits at the repo root, which ruff finds by walking up.
      - name: Ruff check
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

  pytest:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: software
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          version: "${{ env.UV_VERSION }}"
          enable-cache: true
          cache-dependency-glob: software/uv.lock

      - name: Install dependencies
        run: uv sync --all-groups --locked

      # scripts/pytest.sh layers every package's src/requirements.txt into the
      # environment, so the suite runs the versions the block ships rather than
      # whatever the dev group resolves. It collects every <package>/tests/.
      - name: Run pytest
        run: ./scripts/pytest.sh
